<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Series · Top Issue Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1217;
    --panel:#161C24;
    --panel-2:#1D2530;
    --line: #2A3340;
    --text:#E8ECF1;
    --muted:#8C97A8;
    --amber:#F2A33C;
    --teal:#3FB6A8;
    --red:#E2645C;
    --green:#5FC07A;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}

  /* silkscreen header */
  .board-header{
    border-bottom:1px solid var(--line);
    padding:22px 28px 18px;
    background:
      linear-gradient(90deg, transparent 0%, transparent 100%),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(63,182,168,0.06) 40px);
    position:relative;
  }
  .board-header .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; color:var(--teal);
    text-transform:uppercase; margin-bottom:6px;
  }
  .board-header h1{
    font-family:var(--font-display); font-size:26px; font-weight:700; margin:0;
    letter-spacing:-0.01em;
  }
  .board-header .sub{color:var(--muted); font-size:13px; margin-top:4px;}

  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:16px 28px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5;
  }
  input[type=text], select, textarea{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:8px 10px; font-family:var(--font-body); font-size:13px;
  }
  input[type=text]:focus, select:focus, textarea:focus{outline:1px solid var(--teal); border-color:var(--teal);}
  .btn{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.03em;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    padding:8px 14px; border-radius:6px; cursor:pointer; transition:.15s;
  }
  .btn:hover{border-color:var(--teal); color:var(--teal);}
  .btn.primary{background:var(--teal); color:#06231F; border-color:var(--teal); font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08); color:#06231F;}
  .btn.danger:hover{border-color:var(--red); color:var(--red);}
  .spacer{flex:1;}

  .meta-strip{padding:10px 28px; font-family:var(--font-mono); font-size:11px; color:var(--muted); display:flex; gap:18px; flex-wrap:wrap;}
  .meta-strip span b{color:var(--text);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; padding:10px 12px; font-family:var(--font-mono); font-size:10.5px;
    letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid var(--line); position:sticky; top:53px; background:var(--bg); z-index:4;
  }
  tbody tr{border-bottom:1px solid var(--line); cursor:pointer; transition:.1s;}
  tbody tr:hover{background:var(--panel);}
  td{padding:10px 12px; vertical-align:top;}
  .ref{font-family:var(--font-mono); color:var(--teal); font-weight:600;}
  .qty{font-family:var(--font-mono);}
  .led{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; box-shadow:0 0 6px currentColor;}
  .status-pill{
    font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:99px;
    display:inline-flex; align-items:center; white-space:nowrap;
  }
  .st-open{color:var(--red);} .st-open .led{background:var(--red); color:var(--red);}
  .st-investigating{color:var(--amber);} .st-investigating .led{background:var(--amber); color:var(--amber);}
  .st-rca-complete{color:var(--teal);} .st-rca-complete .led{background:var(--teal); color:var(--teal);}
  .st-action-in-progress{color:var(--amber);} .st-action-in-progress .led{background:var(--amber); color:var(--amber);}
  .st-resolved{color:var(--green);} .st-resolved .led{background:var(--green); color:var(--green);}
  .st-monitoring{color:var(--teal);} .st-monitoring .led{background:var(--teal); color:var(--teal);}
  .st-closed{color:var(--muted);} .st-closed .led{background:var(--muted); color:var(--muted);}

  .prio{font-family:var(--font-mono); font-size:10.5px; padding:2px 7px; border:1px solid var(--line); border-radius:4px;}
  .prio-critical{border-color:var(--red); color:var(--red);}
  .prio-high{border-color:var(--amber); color:var(--amber);}
  .prio-medium{border-color:var(--teal); color:var(--teal);}
  .prio-low{border-color:var(--muted); color:var(--muted);}

  .thumb{width:38px; height:38px; border-radius:6px; object-fit:cover; border:1px solid var(--line); display:block; background:var(--panel-2);}
  .thumb-placeholder{width:38px; height:38px; border-radius:6px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px;}
  .image-upload{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .image-preview{width:140px; height:140px; border-radius:8px; object-fit:cover; border:1px solid var(--line); background:var(--panel-2); cursor:zoom-in;}
  .image-preview-placeholder{width:140px; height:140px; border-radius:8px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; text-align:center; padding:8px;}
  .lightbox{position:fixed; inset:0; background:rgba(7,9,12,.85); display:none; align-items:center; justify-content:center; z-index:50; cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:90vw; max-height:90vh; border-radius:8px;}

  .empty-state{padding:60px 28px; text-align:center; color:var(--muted); font-family:var(--font-mono); font-size:13px;}

  /* drawer */
  .overlay{position:fixed; inset:0; background:rgba(7,9,12,.6); display:none; z-index:20;}
  .overlay.show{display:block;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(520px,100%); background:var(--panel);
    border-left:1px solid var(--line); z-index:21; transform:translateX(100%); transition:.22s ease;
    overflow-y:auto;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start;}
  .drawer-head h2{font-family:var(--font-display); font-size:19px; margin:0 0 4px;}
  .drawer-head .ref{font-size:13px;}
  .drawer-body{padding:20px 24px; display:flex; flex-direction:column; gap:14px;}
  .field label{display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{min-height:64px; resize:vertical; font-family:var(--font-body);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .close-x{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1;}
  .close-x:hover{color:var(--text);}

  .log-section{border-top:1px solid var(--line); margin-top:6px; padding-top:14px;}
  .log-section h3{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px;}
  .log-entry{padding:10px 0; border-bottom:1px dashed var(--line); font-size:12.5px;}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .who{font-family:var(--font-mono); color:var(--teal); font-size:11px;}
  .log-entry .when{color:var(--muted); font-size:11px; float:right;}
  .log-entry .what{margin-top:3px; color:var(--text);}
  .comment-box{display:flex; gap:8px; margin-top:8px;}
  .comment-box input{flex:1;}

  .token-banner{
    background:rgba(242,163,60,.08); border:1px solid rgba(242,163,60,.3); color:var(--amber);
    padding:10px 14px; border-radius:6px; font-family:var(--font-mono); font-size:11.5px; margin:14px 28px 0;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .token-banner input{flex:1; min-width:180px;}

  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--panel-2); border:1px solid var(--teal);
    color:var(--text); padding:10px 16px; border-radius:6px; font-family:var(--font-mono); font-size:12.5px;
    z-index:40; opacity:0; transform:translateY(8px); transition:.2s;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.err{border-color:var(--red);}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

  @media(max-width:720px){
    .row2{grid-template-columns:1fr;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tbody tr{padding:10px 16px; border-bottom:1px solid var(--line);}
    td{padding:3px 0;}
    td::before{content:attr(data-label); font-family:var(--font-mono); font-size:10px; color:var(--muted); display:block;}
  }
</style>
</head>
<body>

<div class="board-header">
  <div class="eyebrow">d.light · Kenya · Field Quality</div>
  <h1>X-Series Top Issue Tracker</h1>
  <div class="sub">Live component-level RCA &amp; action tracking, synced to Google Sheets</div>
</div>

<div id="tokenBanner" class="token-banner" style="display:none;">
  ⚠ No edit token set — you can view issues but not edit them.
  <input type="text" id="tokenInput" placeholder="Paste edit token to enable editing">
  <button class="btn" id="saveTokenBtn">Save token</button>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search part, component, RCA…" style="min-width:220px;">
  <select id="statusFilter"><option value="">All statuses</option></select>
  <select id="priorityFilter"><option value="">All priorities</option></select>
  <select id="productFilter"><option value="">All products</option></select>
  <select id="typeFilter"><option value="">Part &amp; Non-Part</option></select>
  <select id="partFilter"><option value="">All parts</option></select>
  <span class="spacer"></span>
  <button class="btn" id="refreshBtn">↻ Refresh</button>
  <button class="btn primary" id="newIssueBtn">+ New Issue</button>
</div>

<div class="meta-strip" id="metaStrip"></div>

<div id="tableWrap">
  <table>
    <thead>
      <tr>
        <th>Status</th><th>Image</th><th>Product</th><th>Component</th><th>Part</th>
        <th>QTY</th><th>Returns</th><th>Priority</th><th>Owner</th><th>Updated</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="emptyState" class="empty-state" style="display:none;">No issues match your filters.</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <h2 id="drawerTitle">New Issue</h2>
      <div class="ref" id="drawerRef"></div>
    </div>
    <button class="close-x" id="closeDrawer">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<script src="config.js"></script>
<script>
const CFG = window.TRACKER_CONFIG || {};
const API_URL = CFG.API_URL;
let EDIT_TOKEN = localStorage.getItem('issueTrackerToken') || CFG.DEFAULT_EDIT_TOKEN || '';
let CURRENT_USER = localStorage.getItem('issueTrackerUser') || '';

let ISSUES = [];
let STATUS_OPTIONS = [];
let PRIORITY_OPTIONS = [];
let TYPE_OPTIONS = [];
let activeIssue = null;

const $ = sel => document.querySelector(sel);
const tbody = $('#tbody');

function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function ensureUser(){
  if(!CURRENT_USER){
    const name = prompt('Your name (shown on edits/comments):','');
    if(name){ CURRENT_USER = name; localStorage.setItem('issueTrackerUser', name); }
  }
  return CURRENT_USER || 'anonymous';
}

function checkToken(){
  $('#tokenBanner').style.display = EDIT_TOKEN ? 'none' : 'flex';
}

$('#saveTokenBtn').addEventListener('click', ()=>{
  const v = $('#tokenInput').value.trim();
  if(v){ EDIT_TOKEN = v; localStorage.setItem('issueTrackerToken', v); checkToken(); toast('Token saved'); }
});

async function apiGet(action, params){
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  return res.json();
}

async function apiPost(payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function loadIssues(){
  if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){
    $('#tableWrap').innerHTML = '<div class="empty-state">Set API_URL in <code>config.js</code> to your deployed Apps Script Web App URL to load data.</div>';
    return;
  }
  try{
    const data = await apiGet('list');
    if(!data.ok) throw new Error(data.error);
    ISSUES = data.issues;
    STATUS_OPTIONS = data.statusOptions;
    PRIORITY_OPTIONS = data.priorityOptions;
    TYPE_OPTIONS = data.typeOptions || ['Part','Non-Part'];
    populateFilters();
    render();
  }catch(err){
    toast('Failed to load: '+err.message, true);
  }
}

function populateFilters(){
  const sf = $('#statusFilter'), pf = $('#priorityFilter'), prf = $('#productFilter'), tf = $('#typeFilter'), paf = $('#partFilter');
  if(sf.options.length<=1){
    STATUS_OPTIONS.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sf.appendChild(o); });
    PRIORITY_OPTIONS.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; pf.appendChild(o); });
  }
  if(tf.options.length<=1){
    TYPE_OPTIONS.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; tf.appendChild(o); });
  }
  const products = [...new Set(ISSUES.map(i=>i.Product).filter(Boolean))].sort();
  prf.querySelectorAll('option:not(:first-child)').forEach(o=>o.remove());
  products.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; prf.appendChild(o); });

  const parts = [...new Set(ISSUES.map(i=>i.Part).filter(Boolean))].sort();
  paf.querySelectorAll('option:not(:first-child)').forEach(o=>o.remove());
  parts.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; paf.appendChild(o); });
}

function filtered(){
  const q = $('#searchInput').value.trim().toLowerCase();
  const st = $('#statusFilter').value;
  const pr = $('#priorityFilter').value;
  const pd = $('#productFilter').value;
  const ty = $('#typeFilter').value;
  const pt = $('#partFilter').value;
  return ISSUES.filter(i=>{
    if(st && i.Status !== st) return false;
    if(pr && i.Priority !== pr) return false;
    if(pd && i.Product !== pd) return false;
    if(ty && i.Type !== ty) return false;
    if(pt && i.Part !== pt) return false;
    if(q){
      const hay = [i.Product,i.Component,i.Part,i.PartDescription,i.RCA,i.Action].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort((a,b)=> (Number(b.ReturnQty)||0) - (Number(a.ReturnQty)||0));
}

function fmtDate(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}

function render(){
  const rows = filtered();
  $('#metaStrip').innerHTML =
    `<span><b>${rows.length}</b> of ${ISSUES.length} issues shown</span>` +
    `<span>Total returns tracked: <b>${ISSUES.reduce((s,i)=>s+(Number(i.ReturnQty)||0),0)}</b></span>`;

  tbody.innerHTML = '';
  $('#emptyState').style.display = rows.length ? 'none':'block';

  rows.forEach(issue=>{
    const tr = document.createElement('tr');
    const stClass = 'st-' + slug(issue.Status || 'open');
    const prClass = 'prio-' + slug(issue.Priority || 'medium');
    const thumb = issue.ImageURL
      ? `<img class="thumb" src="${issue.ImageURL}" alt="${issue.Component||''}">`
      : `<div class="thumb-placeholder">—</div>`;
    tr.innerHTML = `
      <td data-label="Status"><span class="status-pill ${stClass}"><span class="led"></span>${issue.Status||'Open'}</span></td>
      <td data-label="Image">${thumb}</td>
      <td data-label="Product">${issue.Product||'—'}</td>
      <td data-label="Component"><span class="ref">${issue.Component||'—'}</span></td>
      <td data-label="Part">${issue.Part||'—'}</td>
      <td data-label="QTY" class="qty">${issue.QTY||0}</td>
      <td data-label="Returns" class="qty">${issue.ReturnQty||0}</td>
      <td data-label="Priority"><span class="prio ${prClass}">${issue.Priority||'Medium'}</span></td>
      <td data-label="Owner">${issue.Owner||'—'}</td>
      <td data-label="Updated">${fmtDate(issue.LastUpdated)}</td>
    `;
    tr.addEventListener('click', ()=>openDrawer(issue));
    tbody.appendChild(tr);
  });
}

['searchInput','statusFilter','priorityFilter','productFilter','typeFilter','partFilter'].forEach(id=>{
  $('#'+id).addEventListener('input', render);
  $('#'+id).addEventListener('change', render);
});
$('#refreshBtn').addEventListener('click', loadIssues);

/* ---------------- Drawer ---------------- */

function fieldRow(label, name, value, type, options){
  if(type==='select'){
    const opts = options.map(o=>`<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('');
    return `<div class="field"><label>${label}</label><select data-field="${name}">${opts}</select></div>`;
  }
  if(type==='textarea'){
    return `<div class="field"><label>${label}</label><textarea data-field="${name}">${value||''}</textarea></div>`;
  }
  return `<div class="field"><label>${label}</label><input type="text" data-field="${name}" value="${(value||'').toString().replace(/"/g,'&quot;')}"></div>`;
}

function openDrawer(issue){
  activeIssue = issue;
  const isNew = !issue;
  $('#drawerTitle').textContent = isNew ? 'New Issue' : (issue.Component || 'Issue');
  $('#drawerRef').textContent = isNew ? '' : (issue.Part || '');

  const i = issue || {Status:'Open', Priority:'Medium'};
  const imagePreview = i.ImageURL
    ? `<img class="image-preview" id="imagePreview" src="${i.ImageURL}" alt="">`
    : `<div class="image-preview-placeholder" id="imagePreview">No image yet</div>`;

  $('#drawerBody').innerHTML = `
    ${!isNew ? `<div class="field">
      <label>Component image</label>
      <div class="image-upload">
        ${imagePreview}
        <div>
          <input type="file" id="imageFileInput" accept="image/*">
          <div style="color:var(--muted); font-size:11px; margin-top:6px;">JPG/PNG, under ~5MB works best.</div>
        </div>
      </div>
    </div>` : `<div style="color:var(--muted); font-size:12px;">Save the issue first, then you can attach a photo.</div>`}
    <div class="row2">
      ${fieldRow('Product','Product', i.Product)}
      ${fieldRow('Type','Type', i.Type, 'select', TYPE_OPTIONS)}
    </div>
    <div class="row2">
      ${fieldRow('Component (ref. designator)','Component', i.Component)}
      ${fieldRow('Part','Part', i.Part)}
    </div>
    ${fieldRow('Part description','PartDescription', i.PartDescription)}
    <div class="row2">
      ${fieldRow('QTY (failures)','QTY', i.QTY)}
      ${fieldRow('Return QTY','ReturnQty', i.ReturnQty)}
    </div>
    ${fieldRow('Root Cause Analysis','RCA', i.RCA, 'textarea')}
    ${fieldRow('Action / Mitigation','Action', i.Action, 'textarea')}
    <div class="row2">
      ${fieldRow('Status','Status', i.Status, 'select', STATUS_OPTIONS)}
      ${fieldRow('Priority','Priority', i.Priority, 'select', PRIORITY_OPTIONS)}
    </div>
    ${fieldRow('Owner','Owner', i.Owner)}
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn primary" id="saveIssueBtn">${isNew?'Create issue':'Save changes'}</button>
      ${!isNew?'<button class="btn danger" id="deleteIssueBtn">Delete</button>':''}
    </div>
    ${!isNew ? `<div class="log-section">
      <h3>Change log &amp; comments</h3>
      <div id="logList">Loading…</div>
      <div class="comment-box">
        <input type="text" id="commentInput" placeholder="Add a comment…">
        <button class="btn" id="commentBtn">Post</button>
      </div>
    </div>` : ''}
  `;

  $('#saveIssueBtn').addEventListener('click', ()=> isNew ? createIssue() : saveIssue());
  if(!isNew){
    $('#deleteIssueBtn').addEventListener('click', deleteIssue);
    $('#commentBtn').addEventListener('click', postComment);
    loadLog(issue.ID);
    const fileInput = $('#imageFileInput');
    if(fileInput) fileInput.addEventListener('change', handleImageUpload);
    const previewEl = $('#imagePreview');
    if(previewEl && previewEl.tagName === 'IMG') previewEl.addEventListener('click', ()=>openLightbox(previewEl.src));
  }

  $('#overlay').classList.add('show');
  $('#drawer').classList.add('show');
}

function closeDrawer(){
  $('#overlay').classList.remove('show');
  $('#drawer').classList.remove('show');
  activeIssue = null;
}
$('#closeDrawer').addEventListener('click', closeDrawer);
$('#overlay').addEventListener('click', closeDrawer);
$('#newIssueBtn').addEventListener('click', ()=>openDrawer(null));

function readForm(){
  const out = {};
  document.querySelectorAll('[data-field]').forEach(el=> out[el.dataset.field] = el.value);
  return out;
}

async function createIssue(){
  if(!requireToken()) return;
  const user = ensureUser();
  const issue = readForm();
  const data = await apiPost({action:'create', token:EDIT_TOKEN, user, issue});
  if(!data.ok){ toast('Error: '+data.error, true); return; }
  toast('Issue created');
  closeDrawer();
  loadIssues();
}

async function saveIssue(){
  if(!requireToken()) return;
  const user = ensureUser();
  const changes = readForm();
  const data = await apiPost({action:'update', token:EDIT_TOKEN, user, id:activeIssue.ID, changes, comment:'Updated via tracker'});
  if(!data.ok){ toast('Error: '+data.error, true); return; }
  toast('Saved');
  closeDrawer();
  loadIssues();
}

async function deleteIssue(){
  if(!requireToken()) return;
  if(!confirm('Delete this issue? This cannot be undone.')) return;
  const user = ensureUser();
  const data = await apiPost({action:'delete', token:EDIT_TOKEN, user, id:activeIssue.ID});
  if(!data.ok){ toast('Error: '+data.error, true); return; }
  toast('Issue deleted');
  closeDrawer();
  loadIssues();
}

async function postComment(){
  if(!requireToken()) return;
  const user = ensureUser();
  const comment = $('#commentInput').value.trim();
  if(!comment) return;
  const data = await apiPost({action:'comment', token:EDIT_TOKEN, user, id:activeIssue.ID, comment});
  if(!data.ok){ toast('Error: '+data.error, true); return; }
  $('#commentInput').value = '';
  loadLog(activeIssue.ID);
  loadIssues();
}

async function loadLog(issueId){
  const data = await apiGet('log', {issueId});
  const list = $('#logList');
  if(!data.ok || !data.log.length){ list.innerHTML = '<div style="color:var(--muted); font-size:12.5px;">No history yet.</div>'; return; }
  list.innerHTML = data.log.map(l=>`
    <div class="log-entry">
      <span class="who">${l.User}</span><span class="when">${fmtDate(l.Timestamp)}</span>
      <div class="what">${l.Field==='Comment' ? l.Comment : `<b>${l.Field}</b>: ${l.OldValue||'—'} → ${l.NewValue||'—'} ${l.Comment?('— '+l.Comment):''}`}</div>
    </div>
  `).join('');
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]); // strip data: prefix
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleImageUpload(e){
  if(!requireToken()) return;
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 8 * 1024 * 1024){ toast('Image too large (max ~8MB)', true); return; }

  const user = ensureUser();
  toast('Uploading image…');
  try{
    const base64Data = await fileToBase64(file);
    const data = await apiPost({
      action:'uploadImage', token:EDIT_TOKEN, user,
      id: activeIssue.ID, filename: file.name, mimeType: file.type, base64Data
    });
    if(!data.ok){ toast('Upload failed: '+data.error, true); return; }
    toast('Image uploaded');
    activeIssue.ImageURL = data.imageUrl;
    const preview = $('#imagePreview');
    if(preview){
      const img = document.createElement('img');
      img.className = 'image-preview';
      img.id = 'imagePreview';
      img.src = data.imageUrl;
      img.addEventListener('click', ()=>openLightbox(img.src));
      preview.replaceWith(img);
    }
    loadIssues();
    loadLog(activeIssue.ID);
  }catch(err){
    toast('Upload failed: '+err.message, true);
  }
}

function openLightbox(src){
  $('#lightboxImg').src = src;
  $('#lightbox').classList.add('show');
}
$('#lightbox').addEventListener('click', ()=> $('#lightbox').classList.remove('show'));

function requireToken(){
  if(!EDIT_TOKEN){ toast('Set your edit token above first', true); return false; }
  return true;
}

checkToken();
loadIssues();
</script>
</body>
</html>
